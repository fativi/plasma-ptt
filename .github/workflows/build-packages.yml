name: Build Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DEB package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh
      
      - name: Upload DEB to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: plasma-ptt*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM Build Tools
        run: dnf install -y rpm-build make

      - name: Build RPM package
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp plasma-ptt.spec ~/rpmbuild/SPECS/
          
          # Extract version and update spec
          VERSION=$(grep -m1 '__version__' plasma-ptt.py | cut -d'"' -f2)
          sed -i "s/Version:.*/Version:        $VERSION/" ~/rpmbuild/SPECS/plasma-ptt.spec
          
          # Create source tarball
          tar --exclude='.git' --exclude='.github' -czf ~/rpmbuild/SOURCES/plasma-ptt-${VERSION}.tar.gz -C .. $(basename $PWD)
          
          rpmbuild -ba ~/rpmbuild/SPECS/plasma-ptt.spec
          
          # Copy out the built RPM
          cp ~/rpmbuild/RPMS/noarch/plasma-ptt-*.rpm .

      - name: Upload RPM to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: plasma-ptt*.rpm
